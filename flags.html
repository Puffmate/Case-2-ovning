<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flaggor</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <header>
        <img id="logotype" src="images/logotype.webp" alt="Mission Conservation logotyp">
        <nav>
            <a href="index.html">Hem</a>
            <a href="nature.html">Naturen</a>
            <a href="event.html">Event</a>
            <a href="gallery.html">Galleriet</a>
            <a class="active" href="flags.html">Flaggor</a>
        </nav>
    </header>

    <main>

        <h1>Flaggor</h1>

        <div class="flag-container">

            <figure>
                <div class="japan-flag">
                    <div class="red-dot"></div>
                </div>
                <figcaption>Japan</figcaption>
            </figure>

            <figure>
                <div class="sweden-flag">
                    <div class="yellow-vertical"></div>
                    <div class="yellow-horizontal"></div>
                </div>
                <figcaption>Sverige</figcaption>
            </figure>

            <figure>
                <div class="german-flag">
                    <div class="black-top"></div>
                    <div class="red-middle"></div>
                    <div class="yellow-bottom"></div>
                </div>
                <figcaption>Tyskland</figcaption>
            </figure>

            <figure>
                <div class="french-flag">
                    <div class="blue-left"></div>
                    <div class="white-middle"></div>
                    <div class="red-right"></div>
                </div>
                <figcaption>Frankrike</figcaption>
            </figure>

            <figure>
                <div class="scotland-flag">
                    <div class="white-top-left"></div>
                    <div class="white-bottom-right"></div>
                </div>
                <figcaption>Skottland</figcaption>
            </figure>

            <figure>
                <div class="unitedkingdom-flag">
                    <div class="left-diagonal-white"></div>
                    <div class="right-diagonal-white"></div>
                    <div class="lefttop-diagonal-red"></div>
                    <div class="righttop-diagonal-red"></div>
                    <div class="leftbottom-diagonal-red"></div>
                    <div class="rightbottom-diagonal-red"></div>
                    <div class="horizontal-white"></div>
                    <div class="vertical-white"></div>
                    <div class="horizontal-red"></div>
                    <div class="vertical-red"></div>
                </div>
                <figcaption>Storbritannien</figcaption>
            </figure>

        </div>

    </main>

    <footer>
        <p><a href="https://github.com/Puffmate">&copy; 2026 Puffmate</a></p>
        <div class="social-links">
            <img class="social-icon" src="images/icons/facebook.png" alt="Facebook ikonen">
            <img class="social-icon" src="images/icons/instagram.png" alt="Instagram ikonen">
            <img class="social-icon" src="images/icons/linkedin.png" alt="LinkedIn ikonen">
        </div>
        <div class="memorial">
            <p>Till minne av Walter 🐾</p>
        </div>
    </footer>

</body>

</html>
